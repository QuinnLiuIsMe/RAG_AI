name: Backend CI/CD

on:
  pull_request:
    paths:
      - "backend/**"
      - "infra/cdk/**"
      - ".github/workflows/backend-ci-cd.yml"
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "infra/cdk/**"
      - ".github/workflows/backend-ci-cd.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend tests
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/tests -p "test_*.py"

  build_and_push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.image.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        env:
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 || \
          aws ecr create-repository --repository-name "$ECR_REPOSITORY"

      - name: Build, tag, and push image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t "$IMAGE_URI" backend
          docker push "$IMAGE_URI"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build_and_push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install CDK dependencies
        working-directory: infra/cdk
        run: npm install

      - name: Bootstrap CDK
        working-directory: infra/cdk
        run: npx cdk bootstrap

      - name: Deploy CDK stack
        working-directory: infra/cdk
        env:
          IMAGE_TAG: ${{ needs.build_and_push.outputs.image_tag }}
          VPC_ID: ${{ secrets.VPC_ID }}
          PUBLIC_SUBNET_IDS: ${{ secrets.PUBLIC_SUBNET_IDS }}
          PRIVATE_SUBNET_IDS: ${{ secrets.PRIVATE_SUBNET_IDS }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          ALARM_EMAIL: ${{ secrets.ALARM_EMAIL }}
        run: |
          npx cdk deploy --all \
            --require-approval never \
            -c imageTag="$IMAGE_TAG" \
            -c vpcId="$VPC_ID" \
            -c publicSubnetIds="$PUBLIC_SUBNET_IDS" \
            -c privateSubnetIds="$PRIVATE_SUBNET_IDS" \
            -c ecrRepositoryName="$ECR_REPOSITORY" \
            -c alarmEmail="$ALARM_EMAIL"
